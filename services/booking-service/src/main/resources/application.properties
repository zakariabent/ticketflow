
spring.application.name=booking-service

server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:h2:mem:bookingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.cloud.openfeign.client.config.event-service.connectTimeout=2000
spring.cloud.openfeign.client.config.event-service.readTimeout=3000

# Enable Circuit Breaker for OpenFeign
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true


# Event Service Circuit Breaker configuration
ticketflow.resilience.event-service.sliding-window-size=10
ticketflow.resilience.event-service.minimum-number-of-calls=5
ticketflow.resilience.event-service.failure-rate-threshold=50
ticketflow.resilience.event-service.wait-in-open-state=10s
ticketflow.resilience.event-service.permitted-calls-in-half-open-state=3
ticketflow.resilience.event-service.time-limit=4s
# Actuator endpoints
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true